<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">Sub2Video 字体层级与控件规格</title>
  <desc id="desc">设计规范修订的阅读样张，展示400和500字重、字号行高及sm40、md44、lg48像素控件。图为示意，不代表网站已修改。</desc>
  <defs>
    <style>
      text{font-family:'Source Han Sans SC','Microsoft YaHei','PingFang SC',sans-serif;fill:#D8DED8}
      .title{font-size:32px;font-weight:500;fill:#F4F4F0}.section{font-size:22px;font-weight:500;fill:#F4F4F0}
      .body{font-size:16px}.small{font-size:14px;fill:#A2AAA6}.label{font-size:14px;fill:#E8B981}
      .panel{fill:#1B1E1C;stroke:#323832}.ink{fill:#F4F4F0}.dim{fill:#A2AAA6}.accent{fill:#E8B981}
    </style>
  </defs>
  <rect width="1600" height="1130" fill="#141616"/>
  <text x="48" y="57" class="title">Sub2Video · 文字先清楚，操作才有分量</text>
  <text x="48" y="91" class="small">UI 1.1 / 待评审 · Source Han Sans SC 400 / 500 · Inter仅用于字标等有限用途</text>
  <line x1="48" y1="118" x2="1552" y2="118" stroke="#323832"/>

  <rect x="48" y="150" width="928" height="628" rx="12" class="panel"/>
  <text x="80" y="192" class="section">语义字号 · 不再逐页随意缩小</text>
  <text x="80" y="234" class="label">展示标题 / 56 · 68 / 500 / 仅官网首屏</text>
  <text x="80" y="304" font-size="56" font-weight="500" class="ink">把想法，做成好镜头。</text>
  <line x1="80" y1="329" x2="944" y2="329" stroke="#323832"/>
  <text x="80" y="362" class="label">页面标题 / 28 · 38 / 500</text>
  <text x="80" y="404" font-size="28" font-weight="500" class="ink">登录 Sub2Video</text>
  <text x="510" y="362" class="label">区块标题 / 20 · 30 / 500</text>
  <text x="510" y="400" font-size="20" font-weight="500" class="ink">准备素材与选择参数</text>
  <line x1="80" y1="429" x2="944" y2="429" stroke="#323832"/>
  <text x="80" y="462" class="label">官网正文 / 18 · 30 / 400</text>
  <text x="80" y="500" font-size="18">输入文字、参考图片或首尾帧，准备一个短视频镜头。</text>
  <text x="80" y="533" font-size="18">先看懂产品能做什么，再决定下一步。</text>
  <text x="80" y="578" class="label">手机阅读与认证输入 / 16 · 24–26 / 400</text>
  <text x="80" y="613" font-size="16">选择模式，准备自己的素材。页面不因屏幕变小而缩字。</text>
  <text x="80" y="659" class="label">标签 / 14 · 20 / 500</text>
  <text x="80" y="693" font-size="14" font-weight="500">邮箱　密码　视频时长　画幅比例</text>
  <text x="510" y="659" class="label">辅助 / 13 · 20　元信息 / 12 · 18</text>
  <text x="510" y="691" font-size="13">错误与协议保持可读，并说明下一步。</text>
  <text x="510" y="722" font-size="12" class="dim">时间、来源等短元信息，不承载主要动作。</text>
  <text x="80" y="748" class="small">中文默认字距0；不用同一份Medium文件分别冒充500和600。</text>

  <rect x="1008" y="150" width="544" height="628" rx="12" class="panel"/>
  <text x="1040" y="192" class="section">认证表单样板</text>
  <text x="1040" y="225" class="small">目标表单400px · 输入/主按钮48px高</text>
  <text x="1064" y="290" font-size="28" font-weight="500" class="ink">登录 Sub2Video</text>
  <text x="1064" y="328" font-size="16">继续你的素材与镜头创作。</text>
  <text x="1064" y="375" font-size="14" font-weight="500">邮箱</text>
  <rect x="1064" y="389" width="400" height="48" rx="8" fill="#141616" stroke="#78857C"/>
  <text x="1080" y="420" font-size="16" class="dim">name@example.com</text>
  <text x="1064" y="475" font-size="14" font-weight="500">密码</text>
  <rect x="1064" y="489" width="400" height="48" rx="8" fill="#141616" stroke="#78857C"/>
  <text x="1080" y="520" font-size="16" class="dim">输入你的密码</text>
  <rect x="1418" y="491" width="44" height="44" rx="8" fill="none" stroke="#78857C" stroke-dasharray="3 3"/>
  <text x="1440" y="519" text-anchor="middle" font-size="12" class="dim">显隐</text>
  <rect x="1064" y="569" width="400" height="48" rx="8" class="accent"/>
  <text x="1264" y="600" text-anchor="middle" font-size="16" font-weight="500" fill="#25221C" style="fill:#25221C">登录</text>
  <text x="1064" y="652" font-size="13" class="dim">协议与隐私说明为13px，不做细小脚注。</text>
  <text x="1064" y="688" font-size="14" class="dim">第一次使用？　创建账号</text>
  <text x="1040" y="746" class="label">图标命中区44px，图形本身无需放到44px。</text>

  <rect x="48" y="810" width="1504" height="232" rx="12" class="panel"/>
  <text x="80" y="853" class="section">同一套组件，三种合理密度</text>
  <rect x="80" y="881" width="128" height="40" rx="8" fill="#323832"/>
  <text x="144" y="907" text-anchor="middle" font-size="14" font-weight="500">紧凑操作</text>
  <text x="232" y="904" class="body">sm：40px / 14px字</text>
  <rect x="548" y="879" width="136" height="44" rx="8" fill="#323832"/>
  <text x="616" y="907" text-anchor="middle" font-size="14" font-weight="500">默认操作</text>
  <text x="708" y="904" class="body">md：44px / 14px字</text>
  <rect x="1052" y="877" width="136" height="48" rx="8" class="accent"/>
  <text x="1120" y="908" text-anchor="middle" font-size="16" font-weight="500" style="fill:#25221C">开始创作</text>
  <text x="1212" y="904" class="body">lg：48px / 16px字</text>
  <text x="80" y="963" class="small">桌面管理筛选等场景</text>
  <text x="548" y="963" class="small">工作台、弹窗、常规操作</text>
  <text x="1052" y="963" class="small">登录、注册、官网主要入口</text>
  <text x="80" y="1010" class="label">手机有效点击区至少44px；输入文字16px。共享组件定义尺寸，页面只负责组合。</text>
  <text x="48" y="1084" class="small">图示缩放会改变物理显示大小；CSS尺寸以标注和文档为准。SVG使用本机字体回退，不替代浏览器字形验收。</text>
</svg>
